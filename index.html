<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RR Bares · Gestão de Eventos</title>
    <!-- Fonte carregada sem bloquear a renderização — essencial em conexão fraca -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      />
    </noscript>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230d0d15' stroke='%23e8a921' stroke-width='3'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' font-weight='bold' fill='%23e8a921' text-anchor='middle'%3ERR%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Remove service workers e caches deixados pelo app antigo neste domínio
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (chaves) {
          chaves.forEach(function (c) { caches.delete(c); });
        });
      }
    </script>
    <script>
      // Aviso de emergência em JS bem antigo (sem módulos, sem arrow function) —
      // roda mesmo se o bundle principal falhar ao carregar/executar no
      // aparelho do colaborador, para nunca ficar tela branca sem explicação.
      window.__rrErro = null;
      window.addEventListener('error', function (e) {
        if (!window.__rrErro) {
          window.__rrErro = (e && e.message ? e.message : 'Erro desconhecido');
        }
      });
      setTimeout(function () {
        var raiz = document.getElementById('root');
        if (raiz && raiz.childNodes.length === 0) {
          raiz.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0d15;color:#fff;padding:24px;text-align:center;font-family:sans-serif;">' +
            '<p style="font-size:15px;margin-bottom:8px;">Não consegui carregar a página.</p>' +
            '<p style="font-size:12px;color:#999;margin-bottom:16px;">' + (window.__rrErro || 'Verifique sua conexão e tente novamente.') + '</p>' +
            '<button onclick="location.reload()" style="background:#e8a921;color:#0d0d15;border:none;padding:10px 20px;border-radius:8px;font-weight:600;">Tentar novamente</button>' +
            '</div>';
        }
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
